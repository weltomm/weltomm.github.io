<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main>
      <article class="blog-card">
        <img class="blog-card__image" src="./assets/images/illustration-article.svg" alt="Abstract pattern" />
        <div class="blog-card__content">
          <span class="blog-card__tag">Learning</span>
          <time datetime="2023-12-21" class="blog-card__time">Published 21 Dec 2023</time>
          <a href="#" class="blog-card__link">
            <h2 class="blog-card__title">HTML & CSS foundations</h2>
          </a>
          <p class="blog-card__excerpt">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>
        <div class="blog-card__author">
          <img src="./assets/images/image-avatar.webp" alt="" class="blog-card__author-image" />
          <span>Greg Hooper</span>
        </div>
      </article>
    </main>

    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by
      <a href="https://github.com/weltomm">Weltomm</a>.
    </footer>
  </body>
</html>
